services:
  ollama:
    build:
      context: ./docker/ollama
      args:
        OLLAMA_MODEL: qwen2.5:3b-instruct
    restart: unless-stopped
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Named volume, not a bind mount: on first creation Docker seeds it from
    # the image's /root/.ollama (which already has the model baked in from
    # the build), then keeps it across `down`/`up` without re-pulling.
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: qwen2.5:3b-instruct
      LLM_TEMPERATURE: "0.8"
      LLM_MAX_TOKENS: "1024"
      REQUEST_TIMEOUT_SECONDS: "120"
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  ollama_data:
